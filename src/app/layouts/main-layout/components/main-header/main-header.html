<div class="app-main-header d-flex align-items-center justify-content-between gap-3">
  <div class="d-flex align-items-center gap-3 min-w-0">
    <ng-content select=".left" />
  </div>

  <div class="d-flex align-items-center gap-2">
    <ng-content select=".right" />

    @if (user(); as user) {
      <div class="dropdown ms-3">
        <button
          type="button"
          class="app-main-header__avatar-btn"
          aria-label="Tài khoản"
          [attr.aria-expanded]="menuOpen()"
          (click)="toggleMenu()"
        >
          @if (user.picture) {
            <img class="app-main-header__avatar" [src]="user.picture" alt="" />
          } @else {
            <span class="app-main-header__avatar app-main-header__avatar--initial">{{ userInitial() }}</span>
          }
          @if (biz()?.picture; as bizPicture) {
            <img class="app-main-header__biz-logo" [src]="bizPicture" [title]="biz()?.name ?? ''" alt="" />
          }
        </button>

        <ul class="dropdown-menu dropdown-menu-end" [class.show]="menuOpen()">
          <li class="px-3 py-2 border-bottom">
            <div class="fw-medium text-truncate">{{ user.name }}</div>
            <div class="text-secondary fs-sm text-truncate">{{ user.email }}</div>
          </li>
          @if (isAdmin()) {
            <li><a class="dropdown-item" routerLink="/admin">Quản trị</a></li>
          }
          <li><a class="dropdown-item" [href]="profileUrl">Thông tin cá nhân</a></li>
          <li>
            <button type="button" class="dropdown-item" (click)="logout()">Đăng xuất</button>
          </li>
        </ul>
      </div>
    }
  </div>
</div>
