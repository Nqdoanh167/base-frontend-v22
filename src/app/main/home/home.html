<app-main-header>
  <h1 class="left fs-lg fw-semibold mb-0">Trang chủ</h1>
</app-main-header>

<div class="p-3 p-md-4 d-flex flex-column gap-3">
  <div class="d-flex flex-wrap align-items-end justify-content-between gap-3">
    <div>
      <h2 class="fs-xl fw-semibold mb-1">Xin chào, {{ user()?.name }}</h2>
      <p class="text-secondary mb-0">{{ biz()?.name }}</p>
    </div>

    <div class="d-flex flex-wrap gap-2">
      <app-input-date-range style="min-width: 220px" [clearable]="true" [(ngModel)]="dateRange" />
      <app-select
        style="min-width: 160px"
        placeholder="Khoảng thời gian"
        [items]="periods"
        [searchable]="false"
        [clearable]="false"
        [(ngModel)]="period"
      />
      <app-select
        style="min-width: 260px"
        placeholder="Chọn chỉ số"
        [items]="stats"
        [multiple]="true"
        [(ngModel)]="statIds"
      />
    </div>
  </div>

  <div class="row g-3">
    @for (stat of visibleStats(); track stat.id) {
      <div class="col-12 col-sm-6 col-xl-3">
        <div class="card h-100">
          <div class="card-body d-flex align-items-center gap-3">
            <i class="fs-lg text-primary" [class]="stat.icon" aria-hidden="true"></i>
            <div>
              <div class="text-secondary fs-sm">{{ stat.name }}</div>
              <div class="fs-lg fw-semibold">{{ stat.value }}</div>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</div>
